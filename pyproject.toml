[tool.poetry]
name = "another opera"
version = "0.4.2"
description = ""
authors = ["Ivan Boyarintsev <boyarivan06@gmail.com>"]
readme = "README.md"
packages = [
    {include = "app"},
    {include = "bot"},
    {include = "utils"},
]
repository = "https://gitlab.digital.mephi.ru/boyarivan06/another-opera.git"

[tool.poetry.dependencies]
python = "^3.13"
python-dotenv = "^1.0.1"
prompt = "^0.4.1"
pyqt5 = "^5.15.11"
sqlalchemy = "^2.0.38"
pytelegrambotapi = "^4.26.0"
loguru = "^0.7.3"
black = "^25.1.0"
isort = "^6.0.1"


[tool.poetry.group.dev.dependencies]
ruff = "^0.9.6"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
# Максимальная длина строки
line-length = 88

# Выбор категорий ошибок
lint.select = ["E", "F", "W"]

# Игнорируемые ошибки.poe
# Используйте # noqa: <код ошибки> для исключения конкретных строк.
lint.ignore = []

# Исключенные директории
exclude = [".git", "__pycache__", "venv", ".venv"]

[tool.poetry.scripts]
app = "app.main:main"
bot = "bot.main:main"